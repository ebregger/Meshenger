name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Dart & Flutter analysis
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

  build-debug-apk:
    name: Build Debug APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Run native tests and Android release lint
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease --console=plain

      - name: Run tooling tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshenger-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
