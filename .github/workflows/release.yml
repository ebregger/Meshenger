name: Release Candidate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0; defaults to pubspec.yaml version if blank)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Validate & Build Candidate APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Analyze Dart and Flutter
        run: flutter analyze

      - name: Run tooling tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Determine version and release tag
        id: versioning
        env:
          REQUESTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
        run: python3 tools/prepare_release.py version

      - name: Restore release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 tools/prepare_release.py signing

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Preserve Universal APK
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/Meshenger-${TAG_NAME}-universal.apk"

      - name: Run native tests and Android release lint
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease --console=plain

      - name: Build Split-per-ABI Release APKs
        run: flutter build apk --release --split-per-abi

      - name: Stage & Rename Release Artifacts
        id: stage-artifacts
        run: |
          mkdir -p release-assets
          APK_DIR="build/app/outputs/flutter-apk"

          # Copy and rename per-ABI APKs
          cp "${APK_DIR}/app-arm64-v8a-release.apk" "release-assets/Meshenger-${TAG_NAME}-arm64-v8a.apk"
          cp "${APK_DIR}/app-armeabi-v7a-release.apk" "release-assets/Meshenger-${TAG_NAME}-armeabi-v7a.apk"
          cp "${APK_DIR}/app-x86_64-release.apk" "release-assets/Meshenger-${TAG_NAME}-x86_64.apk"

          # Check each signed APK before offering it as a workflow artifact.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          for apk in release-assets/*.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done

          # Generate SHA256 checksums
          cd release-assets
          sha256sum *.apk > SHA256SUMS.txt
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Upload Release Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: meshenger-release-${{ env.TAG_NAME }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove runner signing files
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks
