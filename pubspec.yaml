name: bluetooth_app
description: Meshenger — peer-to-peer mesh chat over BLE (CRDT-synced messages).
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.3.1
  permission_handler: ^12.0.1
  device_info_plus: ^12.3.0
  protobuf: ^6.0.0
  fixnum: ^1.1.1
  sqlite_crdt: ^3.0.4
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.1
  uuid: ^4.5.3
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  protoc_plugin: ^25.0.0

flutter:
  uses-material-design: true
